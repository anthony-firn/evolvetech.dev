name: Check public site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test netlify/lib/evolve-inbox/test/inbox.test.mjs
      - run: python3 tools/check_site.py
