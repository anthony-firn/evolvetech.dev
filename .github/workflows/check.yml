name: Check public site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test netlify/lib/evolve-inbox/test/*.test.mjs
      - run: node --test tools/test_fairground_edge.mjs
      - run: node --test demos/probate/tests/*.test.mjs
      - run: python3 tools/test_jobs_csp.py
      - run: python3 tools/test_hosting_csp.py
      - run: python3 tools/test_llm_csp.py
      - run: python3 tools/test_developer_kits.py
      - run: python3 tools/test_case_law_csp.py
      - run: node --test netlify/lib/open-case-law/search.test.mjs tools/test_case_law_engine.mjs
      - run: node --test tools/test_wallet_setup.mjs
      - run: python3 tools/check_site.py
