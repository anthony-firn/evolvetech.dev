name: Publish Proof episode
# The daily routine pushes each new episode to proof/episode-<YYYY-MM-DD>. This re-runs the episode gate on that
# branch and, only if it passes, squash-merges into main and starts a deploy. A failure leaves main untouched;
# GitHub's failed-workflow notification is the alert. Merges made with GITHUB_TOKEN don't trigger other workflows,
# so the deploy is dispatched explicitly.
on:
  push:
    branches: ['proof/episode-*']
permissions:
  contents: write
  actions: write
concurrency:
  group: proof-episode
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only episode files may change
        run: |
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD)
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^public/play/proof/(episodes/|media/)' ; then
            echo "This branch changes files outside Proof episodes/media. Publish it through a normal pull request."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Episode gate (structure, exercise, voice, live sources)
        run: |
          python3 tools/check_proof.py
          python3 tools/check_proof.py --online --require-video "${GITHUB_REF_NAME#proof/episode-}"
      - name: Play the episode in Chromium under the /play CSP
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/test_proof.py "${GITHUB_REF_NAME#proof/episode-}"
      - name: Squash-merge into main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message=$(git log -1 --format=%B "$GITHUB_SHA")
          git checkout -B publish origin/main
          git merge --squash "$GITHUB_SHA"
          git commit -m "$message" -m "Published from $GITHUB_REF_NAME after the episode gate passed."
          git push origin publish:main
          git push origin --delete "$GITHUB_REF_NAME"
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hosting.yml --ref main -f task=deploy
