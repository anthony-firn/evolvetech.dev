name: Deploy and monitor hosting
on:
  push:
    branches: [main]
    paths: ['public/**', 'tools/**', 'netlify/**', 'netlify.toml', 'hosting.json']
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [deploy, monitor, certificates]
        default: monitor
      force_renewal:
        description: With "certificates", renew even if not due (tests DNS-01 end to end; Let's Encrypt allows 5 a week)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-hosting
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' || inputs.task == 'deploy'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test netlify/lib/evolve-inbox/test/*.test.mjs
      - run: node --test tools/test_fairground_edge.mjs
      - run: node --test demos/probate/tests/*.test.mjs
      - run: python3 tools/test_monitor.py
      - run: python3 tools/test_jobs_csp.py
      - run: python3 tools/test_hosting_csp.py
      - run: python3 tools/test_llm_csp.py
      - run: node --test tools/test_wallet_setup.mjs
      - run: python3 tools/deploy.py
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::103156383756:role/evolvetech-dev-github
          aws-region: us-east-1
      - run: python3 tools/deploy_monitor.py
  monitor:
    if: (github.event_name == 'schedule' && github.event.schedule == '2-59/5 * * * *') || inputs.task == 'monitor'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      # Bunny is updated before Route 53, so an AWS sign-in failure must not stop the monitor from running.
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::103156383756:role/evolvetech-dev-github
          aws-region: us-east-1
      - run: python3 tools/monitor.py --apply
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
  certificates:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 9 * * *') || inputs.task == 'certificates'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::103156383756:role/evolvetech-dev-github
          aws-region: us-east-1
      - name: Install ACME client
        run: |
          curl -fsSL https://github.com/go-acme/lego/releases/download/v5.5.2/lego_v5.5.2_linux_amd64.tar.gz -o /tmp/lego.tar.gz
          curl -fsSL https://github.com/go-acme/lego/releases/download/v5.5.2/lego_5.5.2_checksums.txt -o /tmp/checksums.txt
          cd /tmp
          awk '$2 == "lego_v5.5.2_linux_amd64.tar.gz" {print $1 "  lego.tar.gz"}' checksums.txt | sha256sum -c -
          tar -xzf lego.tar.gz lego
      - run: python3 tools/renew_certificates.py
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          LEGO_BINARY: /tmp/lego
          # Bunny took over five minutes to serve changed challenge records in November 2026; Lego's default is 60 s.
          EXEC_PROPAGATION_TIMEOUT: '1200'
          EXEC_POLLING_INTERVAL: '15'
          LEGO_RENEW_FORCE: ${{ inputs.force_renewal && 'true' || 'false' }}
          # A forced renewal is a new order, not an ARI replacement: Let's Encrypt rejects "replaces" from any account
          # other than the one that issued the current certificate, as happened after the November 2026 bootstrap.
          LEGO_ARI_DISABLE: ${{ inputs.force_renewal && 'true' || 'false' }}
