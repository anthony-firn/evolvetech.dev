name: Deploy and monitor hosting
on:
  push:
    branches: [main]
    paths: ['public/**', 'tools/**', 'netlify/**', 'netlify.toml', 'hosting.json']
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [deploy, monitor, certificates]
        default: monitor
permissions:
  contents: read
concurrency:
  group: production-hosting
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' || inputs.task == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test netlify/lib/evolve-inbox/test/inbox.test.mjs
      - run: python3 tools/test_monitor.py
      - run: python3 tools/deploy.py
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  monitor:
    if: (github.event_name == 'schedule' && github.event.schedule == '2-59/5 * * * *') || inputs.task == 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/monitor.py --apply
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
  certificates:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 9 * * *') || inputs.task == 'certificates'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::727196131369:role/evolvetech-dev-github
          aws-region: us-east-1
      - name: Install ACME client
        run: |
          curl -fsSL https://github.com/go-acme/lego/releases/download/v5.5.2/lego_v5.5.2_linux_amd64.tar.gz -o /tmp/lego.tar.gz
          curl -fsSL https://github.com/go-acme/lego/releases/download/v5.5.2/lego_5.5.2_checksums.txt -o /tmp/checksums.txt
          cd /tmp
          awk '$2 == "lego_v5.5.2_linux_amd64.tar.gz" {print $1 "  lego.tar.gz"}' checksums.txt | sha256sum -c -
          tar -xzf lego.tar.gz lego
      - run: python3 tools/renew_certificates.py
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          LEGO_BINARY: /tmp/lego
