<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title><meta name="description" content="A bundled standalone Snake example for the Evolve LLM workspace."><meta name="robots" content="noindex"><link rel="canonical" href="https://www.evolvetech.dev/play/evolve-llm/examples/snake.html">
<style>body{margin:0;background:#101827;color:#e2e8f0;font:16px system-ui;text-align:center}h1{font-size:24px;margin:8px 0}main{max-width:440px;margin:auto;padding:12px}canvas{display:block;width:min(100%,max(120px,calc(100vh - 240px)));max-width:400px;background:#172033;margin:12px auto;border:1px solid #475569;touch-action:none}button{padding:10px 16px;background:#f97316;border:0;border-radius:8px;color:#111;font:inherit;cursor:pointer}.controls{display:flex;justify-content:center;gap:6px;margin:8px}p{margin:8px}</style>
<main><h1>Snake</h1><p>Score: <strong id="score">0</strong> · Best: <strong id="best">0</strong></p><canvas id="board" width="400" height="400" tabindex="0" aria-label="Snake game board"></canvas><p id="status" role="status">Arrow keys or buttons to steer.</p><button id="restart">Restart</button><div class="controls"><button data-dir="0,-1" aria-label="Up">↑</button><button data-dir="-1,0" aria-label="Left">←</button><button data-dir="0,1" aria-label="Down">↓</button><button data-dir="1,0" aria-label="Right">→</button></div><p>Eat orange food. Avoid walls and your tail.</p></main>
<script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),score=document.querySelector('#score'),status=document.querySelector('#status');
let snake,food,direction,next,points,over,best=0;
function placeFood(){do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function paint(){ctx.fillStyle='#172033';ctx.fillRect(0,0,400,400);ctx.fillStyle='#fb923c';ctx.fillRect(food.x*20+2,food.y*20+2,16,16);ctx.fillStyle='#4ade80';for(const p of snake)ctx.fillRect(p.x*20+1,p.y*20+1,18,18)}
function restart(){snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];direction={x:1,y:0};next=direction;points=0;over=false;score.textContent=0;status.textContent='Arrow keys or buttons to steer.';placeFood();paint()}
function steer(x,y){if(x!==-direction.x||y!==-direction.y)next={x,y}}
function step(){if(over)return;direction=next;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y},eats=head.x===food.x&&head.y===food.y;const body=eats?snake:snake.slice(0,-1);if(head.x<0||head.x>=20||head.y<0||head.y>=20||body.some(p=>p.x===head.x&&p.y===head.y)){over=true;status.textContent='Game over. Press Restart to play again.';return}snake.unshift(head);if(eats){points++;score.textContent=points;best=Math.max(best,points);document.querySelector('#best').textContent=best;if(snake.length===400){over=true;status.textContent='You win!';return}placeFood()}else snake.pop();paint()}
const arrows={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};addEventListener('keydown',e=>{if(arrows[e.key]){e.preventDefault();steer(...arrows[e.key])}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>steer(...b.dataset.dir.split(',').map(Number))));document.querySelector('#restart').addEventListener('click',restart);restart();setInterval(step,140);
</script></html>
